<body>

  <script type="text/babel" data-presets="react" data-type="module">
    const { useState } = React;

    const CATS = {
      data:          { label: "Data",                bg: "#032D60", fg: "#fff",    fgMuted: "rgba(255,255,255,0.6)" },
      chartType:     { label: "Chart type",          bg: "#1896FF", fg: "#fff",    fgMuted: "rgba(255,255,255,0.6)" },
      functionality: { label: "Functionality",       bg: "#AD7BEE", fg: "#fff",    fgMuted: "rgba(255,255,255,0.6)" },
      design:        { label: "Design",              bg: "#04E1CB", fg: "#032D60", fgMuted: "rgba(3,45,96,0.5)" },
      factual:       { label: "Factual grounding",   bg: "#FF784F", fg: "#fff",    fgMuted: "rgba(255,255,255,0.65)" },
      analytical:    { label: "Analytical thinking",  bg: "#FCC003", fg: "#032D60", fgMuted: "rgba(3,45,96,0.5)" },
      conversation:  { label: "Conversation quality", bg: "#FF538A", fg: "#fff",    fgMuted: "rgba(255,255,255,0.65)" },
    };
    const RESP = { viz: "Visualization response quality", nl: "Analytical language response quality", conv: "Conversation quality" };
    const DOMAINS = { sales:"Sales", marketing:"Marketing", cs:"Customer service", edu:"Education", lifesci:"Life sciences", finance:"Financial services", retail:"Retail", health:"Healthcare" };

    const iconStyle = { position:"absolute",top:6,right:6,width:68,height:68,opacity:0.12 };
    const catIcons = {
      data:(<svg viewBox="0 0 80 80" style={iconStyle}><rect x="10" y="12" width="48" height="56" rx="4" fill="none" stroke="currentColor" strokeWidth="2.5"/><line x1="10" y1="26" x2="58" y2="26" stroke="currentColor" strokeWidth="2"/><line x1="10" y1="40" x2="58" y2="40" stroke="currentColor" strokeWidth="2"/><line x1="10" y1="54" x2="58" y2="54" stroke="currentColor" strokeWidth="2"/><line x1="30" y1="12" x2="30" y2="68" stroke="currentColor" strokeWidth="2"/><circle cx="60" cy="58" r="16" fill="currentColor" opacity="0.3"/><path d="M52 58l5 5 11-11" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"/></svg>),
      chartType:(<svg viewBox="0 0 80 80" style={iconStyle}><rect x="8" y="44" width="10" height="24" rx="2" fill="currentColor"/><rect x="22" y="32" width="10" height="36" rx="2" fill="currentColor"/><rect x="36" y="20" width="10" height="48" rx="2" fill="currentColor"/><polyline points="12,28 26,18 40,24 56,12 70,16" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/><circle cx="12" cy="28" r="3" fill="currentColor"/><circle cx="26" cy="18" r="3" fill="currentColor"/><circle cx="40" cy="24" r="3" fill="currentColor"/><circle cx="56" cy="12" r="3" fill="currentColor"/><circle cx="70" cy="16" r="3" fill="currentColor"/></svg>),
      functionality:(<svg viewBox="0 0 80 80" style={iconStyle}><path d="M12 10v52h56" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/><path d="M12 10l-4 6M12 10l4 6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><path d="M68 62l-6-4M68 62l-6 4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><line x1="26" y1="60" x2="26" y2="64" stroke="currentColor" strokeWidth="2"/><line x1="40" y1="60" x2="40" y2="64" stroke="currentColor" strokeWidth="2"/><path d="M54 10h20l-6 10h-8z" fill="currentColor" opacity="0.5"/><line x1="64" y1="20" x2="64" y2="30" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><path d="M30 34l4-6 4 6M44 44l4 6 4-6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>),
      design:(<svg viewBox="0 0 80 80" style={iconStyle}><rect x="8" y="14" width="18" height="18" rx="4" fill="currentColor" opacity="0.8"/><rect x="30" y="14" width="18" height="18" rx="4" fill="currentColor" opacity="0.5"/><rect x="52" y="14" width="18" height="18" rx="4" fill="currentColor" opacity="0.3"/><rect x="8" y="36" width="18" height="18" rx="4" fill="currentColor" opacity="0.6"/><rect x="30" y="36" width="18" height="18" rx="4" fill="currentColor" opacity="0.35"/><path d="M52 38l4 20 5-7 8 4-5-8 8-2z" fill="currentColor" opacity="0.7"/><rect x="22" y="60" width="30" height="14" rx="3" fill="currentColor" opacity="0.4"/></svg>),
      factual:(<svg viewBox="0 0 80 80" style={iconStyle}><rect x="6" y="10" width="30" height="28" rx="3" fill="none" stroke="currentColor" strokeWidth="2"/><rect x="12" y="24" width="5" height="10" rx="1" fill="currentColor" opacity="0.6"/><rect x="19" y="18" width="5" height="16" rx="1" fill="currentColor" opacity="0.6"/><rect x="26" y="21" width="5" height="13" rx="1" fill="currentColor" opacity="0.6"/><rect x="44" y="10" width="30" height="28" rx="3" fill="none" stroke="currentColor" strokeWidth="2"/><line x1="49" y1="18" x2="69" y2="18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><line x1="49" y1="24" x2="65" y2="24" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><line x1="49" y1="30" x2="67" y2="30" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><path d="M36 24h8" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/><circle cx="40" cy="56" r="14" fill="currentColor" opacity="0.25"/><path d="M33 56l4 5 10-10" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>),
      analytical:(<svg viewBox="0 0 80 80" style={iconStyle}><path d="M40 8c-14 0-22 10-22 22 0 10 8 16 10 22h24c2-6 10-12 10-22 0-12-8-22-22-22z" fill="currentColor" opacity="0.25"/><path d="M40 8c-14 0-22 10-22 22 0 10 8 16 10 22h24c2-6 10-12 10-22 0-12-8-22-22-22z" fill="none" stroke="currentColor" strokeWidth="2.5"/><line x1="30" y1="56" x2="50" y2="56" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/><line x1="32" y1="61" x2="48" y2="61" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"/><polyline points="28,38 34,32 40,36 46,24 52,28" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/><circle cx="52" cy="28" r="2.5" fill="currentColor"/></svg>),
      conversation:(<svg viewBox="0 0 80 80" style={iconStyle}><rect x="6" y="8" width="36" height="22" rx="6" fill="currentColor" opacity="0.5"/><path d="M14 30v7l7-7" fill="currentColor" opacity="0.5"/><line x1="12" y1="16" x2="36" y2="16" stroke="currentColor" strokeWidth="2" opacity="0.3" strokeLinecap="round"/><line x1="12" y1="22" x2="30" y2="22" stroke="currentColor" strokeWidth="2" opacity="0.3" strokeLinecap="round"/><circle cx="40" cy="42" r="6" fill="none" stroke="currentColor" strokeWidth="2"/><circle cx="40" cy="42" r="2" fill="currentColor"/><line x1="40" y1="36" x2="40" y2="30" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><line x1="40" y1="48" x2="40" y2="52" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/><rect x="38" y="52" width="36" height="22" rx="6" fill="currentColor" opacity="0.5"/><path d="M66 74v7l-7-7" fill="currentColor" opacity="0.5"/></svg>),
    };

    const criteria=[{id:"V1",cat:"data",rt:"viz",title:"Verify data fidelity",desc:"Check whether the AI faithfully represents the underlying data — right rows, columns, and aggregation.",auditQ:"Did the AI hallucinate data, drop rows, or apply the wrong aggregation?",spectrum:["Exact data, correct aggregation, all rows","Wrong aggregation, minor rounding, subset of columns","Missing rows, fabricated values, hallucinated numbers"],examples:[{domain:"sales",product:"Tableau Agent",utterance:"\"Total revenue by sales rep this quarter\"",correct:"Sum of Revenue for Q3 by Rep. Top rep = $420K. All 12 reps shown, correct aggregation.",partial:"Count of Opportunities instead of Sum of Revenue. Shows 12 reps but values are deal counts, not dollars.",incorrect:"Shows only 8 of 12 reps — 4 with zero revenue silently filtered out."},{domain:"health",product:"Tableau Pulse Q&A",utterance:"\"Average readmission rate by department\"",correct:"Mean readmission rate: Cardiology = 12.3%, Oncology = 8.1%. All departments.",partial:"Median instead of mean. Same departments, different central tendency.",incorrect:"Readmission counts instead of rates. High-volume depts look worse."},{domain:"retail",product:"CRM Analytics",utterance:"\"Total units sold by product category\"",correct:"Sum of Units: Electronics = 4,200, Apparel = 3,800. All categories.",partial:"Order Lines instead of Units. Multi-unit orders counted as 1.",incorrect:"Shows revenue instead of units. Electronics highest due to price."},{domain:"edu",product:"Tableau Concierge",utterance:"\"Total enrollment by program this semester\"",correct:"Headcount: CS = 342, Business = 289. Current semester only.",partial:"Credit hours instead of headcount. Part-timers skew rankings.",incorrect:"Historical cumulative, not current semester. Numbers 5x too high."}]},{id:"V2",cat:"data",rt:"viz",title:"Check field similarity",desc:"Verify the fields bound to visual elements match your analytical intent, even when names differ.",auditQ:"Did the AI pick the right field — or a close-sounding but semantically wrong one?",spectrum:["Exact or semantically identical field with matching type","Related field, compatible type, plausible inference","Unrelated field, wrong type, or missing axis"],examples:[{domain:"marketing",product:"Tableau Agent",utterance:"\"Show me campaign ROI over time\"",correct:"Maps ROI to (Revenue − Cost) / Cost. Time = Campaign Launch Date.",partial:"Maps ROI to Revenue only — ignores cost component entirely.",incorrect:"Maps ROI to Click-Through Rate. Different metric altogether."},{domain:"lifesci",product:"Tableau Data Pro",utterance:"\"Show efficacy by treatment arm\"",correct:"Maps to Primary Endpoint Response Rate. Arms from Trial Arm field.",partial:"Maps to Overall Survival — related outcome, different measure.",incorrect:"Maps to Enrollment Count. Large arms look more 'effective'."},{domain:"finance",product:"CRM Analytics",utterance:"\"Show portfolio returns by sector\"",correct:"Maps to Time-Weighted Return. Sector from GICS classification.",partial:"Maps to Absolute Gain instead of %. Misleading for comparison.",incorrect:"Maps to AUM. Larger sectors appear to 'perform' better."},{domain:"cs",product:"Tableau Pulse Q&A",utterance:"\"Show resolution time by support tier\"",correct:"Maps to Avg Time to Resolution (hours). Tier from Priority.",partial:"Maps to First Response Time — faster, not full resolution.",incorrect:"Maps to Case Count. High-volume tiers look 'slower'."}]},{id:"V3",cat:"chartType",rt:"viz",title:"Validate chart type",desc:"Confirm the chart type is appropriate for your data fields and analytical intent.",auditQ:"Would Show Me recommend this chart? Is there a better mark type for this data?",spectrum:["Top Show Me recommendation for these fields","Valid alternative, plausible but less optimal","Poor choice for the data or analytical task"],examples:[{domain:"sales",product:"Tableau Agent",utterance:"\"Show pipeline trend over 12 months\"",correct:"Line chart — correct for continuous time series.",partial:"Area chart — shows trend but filled area obscures magnitudes.",incorrect:"Pie chart with 12 slices. Can't compare months or see trend."},{domain:"edu",product:"Tableau Concierge",utterance:"\"Compare graduation rates across departments\"",correct:"Bar chart — correct for categorical comparison.",partial:"Dot plot — valid but less familiar to most audiences.",incorrect:"Line chart connecting departments. Implies false continuity."},{domain:"health",product:"Tableau Pulse Q&A",utterance:"\"Relationship between wait time and satisfaction\"",correct:"Scatter plot — correct for two continuous measures.",partial:"Dual-axis bar — shows both but obscures correlation.",incorrect:"Stacked bar. Cannot show relationship at all."},{domain:"retail",product:"CRM Analytics",utterance:"\"Show distribution of order values\"",correct:"Histogram — correct for continuous distribution.",partial:"Box plot — valid summary but loses shape detail.",incorrect:"Bar per order ID. No distribution insight, just noise."}]},{id:"V4",cat:"functionality",rt:"viz",title:"Inspect axis accuracy",desc:"Check that X/Y axes use the intended fields with correct orientation, scale, and zero baselines.",auditQ:"Are the axes correct? Does the y-axis start at zero? Are X and Y swapped?",spectrum:["Correct fields, orientation, zero baseline, units","Swapped axes, or non-zero baseline exaggerating gaps","Wrong fields, incorrect scale type, or missing axis"],examples:[{domain:"finance",product:"Tableau Agent",utterance:"\"Quarterly returns by fund\"",correct:"Fund on x, Return % on y at 0%. Units labeled.",partial:"Y starts at 8% — 9% vs 10% looks like a 2x difference.",incorrect:"Axes reversed. Return on x, Fund on y. Disorienting."},{domain:"marketing",product:"Tableau Pulse Q&A",utterance:"\"Email open rates by campaign\"",correct:"Campaign on x, Open Rate % on y at 0. Clear labels.",partial:"Y starts at 15%. Small differences look dramatic.",incorrect:"Campaigns on y alphabetically, no units on Open Rate."},{domain:"lifesci",product:"Tableau Data Pro",utterance:"\"Adverse event frequency by severity\"",correct:"Severity on x (Mild→Severe), Count on y at 0.",partial:"Axes swapped — valid but horizontal bars unexpected.",incorrect:"Severity on continuous scale (1-5), not ordinal."},{domain:"cs",product:"Tableau Concierge",utterance:"\"CSAT scores by agent\"",correct:"Agent on x, CSAT (1-5) on y at 0. Units shown.",partial:"Y starts at 3.5 — agents look identical or wildly different.",incorrect:"Agent ID on continuous x. Gaps distort spacing."}]},{id:"V5",cat:"functionality",rt:"viz",title:"Audit filter accuracy",desc:"Verify exactly the right filters are applied — nothing silently added, nothing silently dropped.",auditQ:"Are there phantom filters added or expected filters missing?",spectrum:["Exact filter match, including semantic equivalents","Extra unrequested filter, or carryover from prior turn","Missing filter, wrong value, or filter on wrong field"],examples:[{domain:"sales",product:"Tableau Agent",utterance:"\"Closed-won deals in Q4\"",correct:"Stage = Closed Won AND Close Date in Q4. No extras.",partial:"Adds Owner = you silently. Only your deals, not team.",incorrect:"No date filter. Closed Won across all quarters."},{domain:"retail",product:"CRM Analytics",utterance:"\"Returns for electronics this month\"",correct:"Category = Electronics AND Date = March 2026.",partial:"Also filters Store = Flagship. Misses 14 locations.",incorrect:"No date filter. Shows 3 years, not this month."},{domain:"edu",product:"Tableau Pulse Q&A",utterance:"\"Enrollment for graduate programs\"",correct:"Level = Graduate. All graduate programs shown.",partial:"Graduate AND Dept = Engineering from prior question.",incorrect:"No level filter. Undergrad + graduate combined."},{domain:"health",product:"Tableau Concierge",utterance:"\"ICU admissions, patients over 65\"",correct:"Unit = ICU AND Age > 65. All matching shown.",partial:"Adds Diagnosis = Cardiac silently. Only cardiac ICU.",incorrect:"Age filter missing. All ICU admissions shown."}]},{id:"V6",cat:"functionality",rt:"viz",title:"Confirm sort order",desc:"Ensure sort fields and directions match your request or can be reasonably inferred from context.",auditQ:"Is the data sorted the way I asked — especially for \"top N\" queries?",spectrum:["Correct field and direction, or semantically equivalent","Right field, wrong direction, or direction ambiguous","No sort when clearly expected, or sort on wrong field"],examples:[{domain:"marketing",product:"Tableau Agent",utterance:"\"Top 5 campaigns by conversion rate\"",correct:"5 campaigns descending by Conversion. Highest first.",partial:"Ascending — shows lowest 5, not top 5.",incorrect:"Alphabetical. No sort on conversion at all."},{domain:"cs",product:"Tableau Pulse Q&A",utterance:"\"Worst agents by CSAT\"",correct:"Ascending by CSAT — lowest first. Matches 'worst'.",partial:"Descending — best agents shown. Direction inverted.",incorrect:"Alphabetical by name. CSAT not used as key."},{domain:"finance",product:"CRM Analytics",utterance:"\"Bottom 10 accounts by revenue growth\"",correct:"Ascending by Growth %. Negative growth first.",partial:"Descending — top growers, not bottom.",incorrect:"By Account Name. Growth not factored in."},{domain:"lifesci",product:"Tableau Data Pro",utterance:"\"Rank sites by enrollment speed\"",correct:"Descending by Patients/Month. Fastest first.",partial:"By total enrollment, not rate. Large slow sites rank high.",incorrect:"Site-ID order. No ranking despite 'rank' in request."}]},{id:"V7",cat:"design",rt:"viz",title:"Evaluate visual encodings",desc:"Check that color, size, shape, and labels map data to visual channels truthfully and appropriately.",auditQ:"Is each encoding type appropriate for the data type? Categorical palette for nominal?",spectrum:["Correct field + appropriate encoding type","Right field, wrong palette or extra encoding","Missing encoding, meaningless channel, or mismatch"],examples:[{domain:"retail",product:"Tableau Agent",utterance:"\"Sales by region colored by category\"",correct:"Color → Category (nominal), distinct hues. Distinguishable.",partial:"Color → Category using sequential gradient. False ordering.",incorrect:"Color → Row ID. Every bar different, no meaning."},{domain:"health",product:"Tableau Pulse Q&A",utterance:"\"Readmissions by hospital, sized by volume\"",correct:"Size → Volume (quantitative), proportional. Color → Hospital.",partial:"Size → Hospital Name. Different sizes, meaningless.",incorrect:"No size encoding despite request."},{domain:"sales",product:"CRM Analytics",utterance:"\"Pipeline by stage, colored by probability\"",correct:"Color → Probability, sequential gradient. Higher = darker.",partial:"Color → Probability, categorical hues. 20/50/80% unrelated.",incorrect:"Color → Owner. Ignores probability entirely."},{domain:"edu",product:"Tableau Concierge",utterance:"\"GPA vs SAT, shaped by program\"",correct:"Shape → Program (nominal), distinct marks. ≤6 programs.",partial:"15 programs — too many shapes, indistinguishable.",incorrect:"No shape. All circles. Program distinction lost."}]},{id:"V8",cat:"design",rt:"viz",title:"Test interactivity",desc:"Verify that tooltips, selections, and drill-downs show accurate, relevant data on demand.",auditQ:"When I hover, does the tooltip show correct values with the right aggregation?",spectrum:["All fields correct, formatted, consistent","Partial coverage, wrong aggregation, or duplicates","No tooltip, wrong values, or contradicts chart"],examples:[{domain:"cs",product:"Tableau Agent",utterance:"Hover over \"Cases by Category\"",correct:"Category: Billing, Cases: 847, Avg Res: 4.2 hrs. Matches.",partial:"Count correct but resolution shows Sum, not Average.",incorrect:"Shows Opportunity Amount — wrong datasource."},{domain:"lifesci",product:"Tableau Data Pro",utterance:"Hover over \"Dose Response Curve\"",correct:"Dose: 50mg, Response: 62%, n=84, CI: 51-73%.",partial:"Dose and Response but missing sample size and CI.",incorrect:"No tooltip. Data points unidentifiable."},{domain:"finance",product:"CRM Analytics",utterance:"Hover over portfolio allocation",correct:"Tech, 28.3%, $4.2M, Benchmark: 25.1%. All correct.",partial:"Sector and % but value = Count of Holdings, not $.",incorrect:"Previous quarter data. Stale, contradicts chart."},{domain:"marketing",product:"Tableau Pulse Q&A",utterance:"Hover over \"Funnel by Stage\"",correct:"MQL, Count: 1,240, Conversion: 34%. Matches.",partial:"Stage and Count but conversion rate missing.",incorrect:"'Sum of MQL' shown on SQL stage. Labels wrong."}]},{id:"L1",cat:"factual",rt:"nl",title:"Confirm factual grounding",desc:"Ensure the text explanation matches the visualization — same facts, direction, and magnitudes.",auditQ:"If I read only the text, would I draw the same conclusions as from the chart?",spectrum:["Measures, magnitudes, directions all match","Aligned but missing specifics or vague","Contradicts chart, wrong measure, or fabricated"],examples:[{domain:"sales",product:"Tableau Agent",utterance:"\"How did Q4 pipeline perform?\"",correct:"\"Grew 18% to $12.3M, Enterprise +32%.\" Matches chart.",partial:"\"Healthy growth in Q4.\" No magnitudes.",incorrect:"\"Declined slightly.\" Contradicts visible growth."},{domain:"health",product:"Tableau Pulse Q&A",utterance:"\"Summarize ER wait trends\"",correct:"\"Rose from 42 to 67 min, +60%.\" Matches line chart.",partial:"\"Waits increasing this year.\" No figures.",incorrect:"\"Remained stable.\" Contradicts upward trend."},{domain:"edu",product:"Tableau Concierge",utterance:"\"How are dropout rates trending?\"",correct:"\"Fell 8.2% to 5.1% over 3 years, −38%.\" Matches.",partial:"\"Improved recently.\" Vague, no magnitude.",incorrect:"\"At all-time high.\" Contradicts declining trend."},{domain:"retail",product:"CRM Analytics",utterance:"\"What happened to basket size?\"",correct:"\"Dropped $47 to $41 in Q3, −13%. Electronics drove it.\"",partial:"\"Dipped slightly.\" 13% is not slight.",incorrect:"\"New peak in Q3.\" Text says up, chart says down."}]},{id:"L2",cat:"analytical",rt:"nl",title:"Demand assumption disclosure",desc:"Look for the AI to surface filters, timeframes, aggregation choices, and field mappings it applied.",auditQ:"Did the AI tell me what it assumed — or silently make choices I can't verify?",spectrum:["States filters, timeframes, aggregation, mappings","Some assumptions noted but key ones missing","No disclosure — zero transparency"],examples:[{domain:"marketing",product:"Tableau Agent",utterance:"\"Show campaign performance\"",correct:"\"Active, Q1 2026, by conversion, excluding tests.\"",partial:"\"Filtered to Q1.\" Omits test exclusion.",incorrect:"\"Here is performance.\" Nothing stated."},{domain:"finance",product:"CRM Analytics",utterance:"\"Compare fund performance\"",correct:"\"12-mo TWR, net of fees, vs S&P 500, March 2026.\"",partial:"\"12-month returns.\" Omits fees and benchmark.",incorrect:"\"Here are comparisons.\" No methodology."},{domain:"lifesci",product:"Tableau Data Pro",utterance:"\"Show treatment outcomes\"",correct:"\"ITT, primary endpoint Wk 12, excl. screen failures.\"",partial:"\"Week 12 results.\" Omits analysis population.",incorrect:"\"Here are outcomes.\" No details at all."},{domain:"cs",product:"Tableau Pulse Q&A",utterance:"\"How is support performing?\"",correct:"\"Avg resolution (hrs), Tier 1-3, excl. auto-closed, 30d.\"",partial:"\"Last 30 days.\" Omits exclusion criteria.",incorrect:"\"Here is performance.\" No metric or window."}]},{id:"L3",cat:"analytical",rt:"nl",title:"Seek meaningful insights",desc:"Evaluate whether the AI surfaces trends, anomalies, and actionable implications beyond restating your query.",auditQ:"Did it tell me something I didn't know — or just echo my request?",spectrum:["Trends + anomalies + causes + actions","Basic observation, no explanation or action","Echoes query, no analytical value"],examples:[{domain:"retail",product:"Tableau Agent",utterance:"\"What's happening with returns?\"",correct:"\"Electronics +40% in March — new laptop. Investigate quality.\"",partial:"\"Electronics returns higher.\" No cause or action.",incorrect:"\"Here is a breakdown.\" Restates request."},{domain:"edu",product:"Tableau Concierge",utterance:"\"Why is enrollment down?\"",correct:"\"Online −22%, in-person +8% — pandemic shift. Aid apps −15%.\"",partial:"\"Down 12% vs last year.\" No explanation.",incorrect:"\"Here are the numbers.\" Ignores the 'why'."},{domain:"sales",product:"CRM Analytics",utterance:"\"How is the West doing?\"",correct:"\"−15% quota but 42% close rate. Bottleneck is volume, not conversion.\"",partial:"\"Below quota.\" No root cause.",incorrect:"\"Here is West performance.\" Echoes request."},{domain:"health",product:"Tableau Pulse Q&A",utterance:"\"What's happening with readmissions?\"",correct:"\"Cardiology 11→16% in Q3, heart failure. July protocol change.\"",partial:"\"Increased in Q3.\" No dept or cause.",incorrect:"\"Here are rates.\" No analysis."}]},{id:"C1",cat:"conversation",rt:"conv",title:"Check coherence",desc:"Evaluate whether the response is internally consistent, logically structured, and free from contradictions.",auditQ:"Does each sentence follow logically — or does it contradict itself?",spectrum:["Clear logical chain, cause-and-effect, consistent","Mostly coherent, minor gaps or non-sequiturs","Self-contradictory, broken logic"],examples:[{domain:"cs",product:"Tableau Agent",utterance:"\"Why did CSAT drop in March?\"",correct:"\"Fell to 3.2 as resolution rose 40%. CRM migration caused delays.\"",partial:"\"CSAT dropped. Resolution up. Hired agents.\" No connection.",incorrect:"\"CSAT improved, so invest to fix decline.\" Contradicts itself."},{domain:"finance",product:"CRM Analytics",utterance:"\"Explain portfolio performance\"",correct:"\"Tech at 35% drove 4.2% gain. But overweight = concentration risk.\"",partial:"\"Tech good. Bonds down. Positive overall.\" Disconnected.",incorrect:"\"Returns strong so risk low, leverage up.\" Returns ≠ low risk."},{domain:"marketing",product:"Tableau Pulse Q&A",utterance:"\"What happened to email engagement?\"",correct:"\"Opens −12% after list +30% — diluted quality. Clicks held.\"",partial:"\"Opens fell. Clicks stable. List grew.\" No causal link.",incorrect:"\"Engagement up, but address sharp decline.\" Contradicts."},{domain:"lifesci",product:"Tableau Data Pro",utterance:"\"Summarize the safety profile\"",correct:"\"Grade 3+ AEs: 18% high vs 7% low dose, dose-dependent. No new signals.\"",partial:"\"AEs higher high-dose. Well-tolerated. No concerns.\" Contradicts.",incorrect:"\"Safety excellent, increase dose to improve.\" If excellent, why?"}]},{id:"C2",cat:"conversation",rt:"conv",title:"Test follow-up relevance",desc:"In multi-turn analysis, verify the AI retains context — filters, categories, goals — across turns.",auditQ:"Did earlier filters and context carry forward, or did it start from scratch?",spectrum:["All prior context preserved, adapts to intent","Some context kept, key filters dropped","Context lost, resets, re-specify everything"],examples:[{domain:"health",product:"Tableau Agent",utterance:"T1: \"ICU by month\" → T2: \"By diagnosis\"",correct:"Diagnosis within ICU monthly. Both preserved.",partial:"Diagnosis shown but monthly axis dropped.",incorrect:"All admissions by diagnosis. ICU + monthly lost."},{domain:"sales",product:"CRM Analytics",utterance:"T1: \"Enterprise pipeline\" → T2: \"Compare to last Q\"",correct:"Enterprise current vs last Q. Segment preserved.",partial:"Compares quarters but Enterprise dropped.",incorrect:"Current Q, all segments. Both gone."},{domain:"retail",product:"Tableau Pulse Q&A",utterance:"T1: \"Online, Northeast\" → T2: \"Categories growing?\"",correct:"Growth within Online + Northeast. Both retained.",partial:"Online growth but Northeast dropped.",incorrect:"All-channel, all-region. Turn 1 ignored."},{domain:"edu",product:"Tableau Concierge",utterance:"T1: \"STEM enrollment\" → T2: \"Gender breakdown\"",correct:"Gender within STEM. Filter preserved.",partial:"Gender all programs. STEM dropped.",incorrect:"University demographics. All context lost."}]}];

    const allCards=criteria.flatMap(c=>c.examples.map((ex,i)=>({...c,exIdx:i,ex,cardKey:`${c.id}-${i}`})));

    function Front({card}){
      const cat=CATS[card.cat];
      const isDark=cat.fg==="#fff";
      const sbarBg=isDark?"rgba(0,0,0,0.15)":"rgba(3,45,96,0.08)";
      const sbarTxt=isDark?"rgba(255,255,255,0.4)":"rgba(3,45,96,0.3)";
      const ovrBg=isDark?"rgba(0,0,0,0.12)":"rgba(3,45,96,0.08)";
      const sideLabel=`${RESP[card.rt]} – ${DOMAINS[card.ex.domain]}`;
      return(
        <div style={{position:"absolute",inset:0,backfaceVisibility:"hidden",borderRadius:8,overflow:"hidden",display:"flex",background:cat.bg,color:cat.fg,boxShadow:"0 4px 16px rgba(0,0,0,0.18)"}}>
          <div style={{width:18,background:sbarBg,display:"flex",alignItems:"center",justifyContent:"center",writingMode:"vertical-rl",textOrientation:"mixed",transform:"rotate(180deg)",flexShrink:0}}>
            <span style={{fontSize:6,fontWeight:700,letterSpacing:"0.08em",color:sbarTxt,textTransform:"uppercase",whiteSpace:"nowrap"}}>{sideLabel}</span>
          </div>
          <div style={{flex:1,display:"flex",flexDirection:"column",position:"relative",overflow:"hidden"}}>
            <div style={{color:cat.fg}}>{catIcons[card.cat]}</div>
            <div style={{padding:"14px 14px 0",flex:1,display:"flex",flexDirection:"column",position:"relative",zIndex:1}}>
              <div style={{fontSize:9,fontWeight:600,color:cat.fgMuted,letterSpacing:"0.04em",marginBottom:10}}>{cat.label}</div>
              <div style={{fontSize:18,fontWeight:800,lineHeight:1.2,letterSpacing:"-0.01em",marginBottom:10,color:cat.fg}}>{card.title}<span style={{whiteSpace:"nowrap"}}>{" "}<span style={{fontWeight:400,opacity:0.5}}>›</span></span></div>
              <div style={{fontSize:10,lineHeight:1.55,color:cat.fgMuted,fontWeight:400}}>{card.desc}</div>
              <div style={{flex:1}}/>
              <div style={{background:ovrBg,borderRadius:6,padding:"8px 10px",marginBottom:14}}>
                <div style={{fontSize:7,fontWeight:700,color:cat.fgMuted,letterSpacing:"0.1em",marginBottom:3,textTransform:"uppercase"}}>Ask yourself</div>
                <div style={{fontSize:9.5,fontWeight:600,lineHeight:1.4,fontStyle:"italic",color:cat.fg,opacity:0.95}}>{card.auditQ}</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Back({card}){
      const cat=CATS[card.cat];const ex=card.ex;
      const sbarBg=`${cat.bg}12`;
      const sbarTxt=`${cat.bg}55`;
      const sideLabel=`${RESP[card.rt]} – ${DOMAINS[ex.domain]}`;
      const tiers=[
        {label:"CORRECT",icon:"✓",color:"#04E1CB",tc:"#032D60",text:ex.correct},
        {label:"PARTIALLY CORRECT",icon:"~",color:"#FCC003",tc:"#5A4500",text:ex.partial},
        {label:"INCORRECT",icon:"✗",color:"#FF538A",tc:"#6B1A32",text:ex.incorrect},
      ];
      return(
        <div style={{position:"absolute",inset:0,backfaceVisibility:"hidden",borderRadius:8,overflow:"hidden",display:"flex",transform:"rotateY(180deg)",boxShadow:"0 4px 16px rgba(0,0,0,0.18)"}}>
          <div style={{width:18,background:sbarBg,display:"flex",alignItems:"center",justifyContent:"center",writingMode:"vertical-rl",textOrientation:"mixed",transform:"rotate(180deg)",flexShrink:0}}>
            <span style={{fontSize:6,fontWeight:700,letterSpacing:"0.08em",color:sbarTxt,textTransform:"uppercase",whiteSpace:"nowrap"}}>{sideLabel}</span>
          </div>
          <div style={{flex:1,background:"#fff",display:"flex",flexDirection:"column"}}>
            <div style={{height:4,background:cat.bg}}/>
            <div style={{padding:"6px 10px",flex:1,display:"flex",flexDirection:"column"}}>
              <div style={{fontSize:8,fontWeight:700,color:cat.bg,marginBottom:5}}>{cat.label} · {card.title}</div>
              <div style={{background:"#F5F5F3",borderRadius:5,padding:"4px 7px",marginBottom:5}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:1}}>
                  <span style={{fontSize:6,fontWeight:700,color:"#aaa",letterSpacing:"0.08em",textTransform:"uppercase"}}>User asks</span>
                  <span style={{fontSize:5.5,color:"#bbb",fontWeight:500}}>{ex.product}</span>
                </div>
                <div style={{fontSize:8.5,color:"#333",fontWeight:600,lineHeight:1.3}}>{ex.utterance}</div>
              </div>
              {tiers.map((t,i)=>(
                <div key={i} style={{marginBottom:i<2?3:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:3,marginBottom:1}}>
                    <div style={{width:10,height:10,borderRadius:5,background:t.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:7,color:t.label==="INCORRECT"?"#fff":"#032D60",fontWeight:800,lineHeight:1}}>{t.icon}</div>
                    <span style={{fontSize:6,fontWeight:800,color:t.tc,letterSpacing:"0.04em"}}>{t.label}</span>
                  </div>
                  <div style={{fontSize:7.5,color:t.tc,lineHeight:1.35,paddingLeft:13}}>{t.text}</div>
                </div>
              ))}
              <div style={{flex:1,minHeight:2}}/>
              <div>
                <div style={{display:"flex",height:4,borderRadius:2,overflow:"hidden",marginBottom:2}}>
                  <div style={{flex:1,background:"#04E1CB"}}/><div style={{flex:1,background:"#FCC003"}}/><div style={{flex:1,background:"#FF538A"}}/>
                </div>
                <div style={{display:"flex",gap:1}}>
                  {card.spectrum.map((l,i)=>(
                    <span key={i} style={{flex:1,fontSize:5.5,lineHeight:1.2,color:["#032D60","#5A4500","#6B1A32"][i],fontWeight:500,textAlign:["left","center","right"][i]}}>{l}</span>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function FlipCard({card}){const[f,setF]=useState(false);return(<div onClick={()=>setF(!f)} style={{perspective:1000,cursor:"pointer",width:215,height:301,flexShrink:0}}><div style={{position:"relative",width:"100%",height:"100%",transformStyle:"preserve-3d",transition:"transform 0.5s cubic-bezier(0.4,0,0.2,1)",transform:f?"rotateY(180deg)":"rotateY(0deg)"}}><Front card={card}/><Back card={card}/></div></div>);}

    const catOrder=["data","chartType","functionality","design","factual","analytical","conversation"];

    function LexaraDeck(){
      const[cf,setCf]=useState("all");const[df,setDf]=useState("all");
      const filtered=allCards.filter(c=>(cf==="all"||c.cat===cf)&&(df==="all"||c.ex.domain===df));
      return(
        <div style={{fontFamily:"'SF Pro Display','Segoe UI',system-ui,sans-serif",maxWidth:1060,margin:"0 auto",padding:"0 8px"}}>
          <div style={{textAlign:"center",marginBottom:16}}>
            <div style={{display:"inline-block",fontSize:9,fontWeight:800,letterSpacing:"0.14em",color:"#fff",background:"#032D60",padding:"4px 14px",borderRadius:4,textTransform:"uppercase",marginBottom:8}}>Lexara Guideline Cards</div>
            <h1 style={{fontSize:22,fontWeight:800,color:"#032D60",margin:"8px 0 4px",letterSpacing:"-0.02em"}}>Verify Your AI Analytics</h1>
            <p style={{fontSize:11,color:"#888",margin:0,maxWidth:540,marginLeft:"auto",marginRight:"auto"}}>52-card deck: 13 criteria × 4 domain examples. Tap any card to flip.</p>
          </div>
          <div style={{marginBottom:6}}>
            <div style={{fontSize:9,fontWeight:700,color:"#aaa",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:4,textAlign:"center"}}>Criteria</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4,justifyContent:"center"}}>
              <button onClick={()=>setCf("all")} style={{padding:"4px 12px",borderRadius:4,fontSize:9,fontWeight:700,cursor:"pointer",border:"none",background:cf==="all"?"#032D60":"#f0f0f0",color:cf==="all"?"#fff":"#666"}}>All</button>
              {catOrder.map(k=>{const c=CATS[k];return (<button key={k} onClick={()=>setCf(k)} style={{padding:"4px 12px",borderRadius:4,fontSize:9,fontWeight:700,cursor:"pointer",border:"none",background:cf===k?c.bg:"#f0f0f0",color:cf===k?c.fg:"#666"}}>{c.label}</button>)})}
            </div>
          </div>
          <div style={{marginBottom:16}}>
            <div style={{fontSize:9,fontWeight:700,color:"#aaa",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:4,textAlign:"center"}}>Domain</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4,justifyContent:"center"}}>
              <button onClick={()=>setDf("all")} style={{padding:"4px 12px",borderRadius:4,fontSize:9,fontWeight:700,cursor:"pointer",border:"none",background:df==="all"?"#032D60":"#f0f0f0",color:df==="all"?"#fff":"#666"}}>All</button>
              {Object.entries(DOMAINS).map(([k,v])=><button key={k} onClick={()=>setDf(k)} style={{padding:"4px 12px",borderRadius:4,fontSize:9,fontWeight:700,cursor:"pointer",border:"none",background:df===k?"#555":"#f0f0f0",color:df===k?"#fff":"#666"}}>{v}</button>)}
            </div>
          </div>
          <div style={{textAlign:"center",marginBottom:10}}><span style={{fontSize:10,color:"#999"}}>Showing {filtered.length} of 52 cards</span></div>
          <div style={{display:"flex",flexWrap:"wrap",gap:12,justifyContent:"center",marginBottom:24}}>
            {filtered.map(card=><FlipCard key={card.cardKey} card={card}/>)}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<LexaraDeck />);
  </script>
</body>
</html>
